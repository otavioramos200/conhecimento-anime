<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interativo - Start Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="card" aria-labelledby="titulo-contador">
            <!-- Título Acessível -->
            <h1 id="titulo-contador">Painel de Engajamento</h1>
            <p class="descricao">Clique nos botões abaixo para interagir. Ao atingir metas, novas mensagens serão desbloqueadas!</p>
            
            <!-- Imagem de Gamer (Link direto e funcional adicionado) -->
            <div class="gamer-imagem-container">
                <img src="https://unsplash.com" alt="Pessoa jogando videogame em um ambiente gamer com luzes azuis e neon" class="gamer-img">
            </div>

            <!-- Área do Contador -->
            <article class="contador-box">
                <span class="label">Total de Interações</span>
                <!-- aria-live atualiza leitores de tela automaticamente quando o número muda -->
                <div id="numero-contador" class="numero" aria-live="polite">0</div>
                <p id="mensagem-alerta" class="mensagem" role="status" aria-atomic="true"></p>
            </article>

            <!-- Controles com Flexbox -->
            <div class="botoes-grupo">
                <button id="btn-subtrair" class="btn btn-secundario" aria-label="Diminuir uma interação">-1</button>
                <button id="btn-adicionar" class="btn btn-primario" aria-label="Aumentar uma interação">+1</button>
            </div>

            <!-- Botão de Reset -->
            <button id="btn-reset" class="btn-reset" aria-label="Zerar o contador">Zerar Painel</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
