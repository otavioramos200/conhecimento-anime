<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otávio | Meu Rascunho Gamer</title>
  
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
       
        <section class="game-card" aria-labelledby="game-title">
            
            
 <header class="game-header">
<h1 id="game-title">Otávio Arcade 🕹️</h1>
 <p class="game-subtitle">Clique nos botões abaixo para farmar XP!</p>
 </header>
 <div class="avatar-container">
    <img src="https://unsplash.com" alt="Setup gamer com luzes azuis e neon" class="avatar-img">
  </div>
  <article class="scoreboard">
<span class="score-label">XP TOTAL:</span>
 <div id="numero-contador" class="score-number" aria-live="polite">0</div>
  <p id="mensagem-alerta" class="achievement-msg" role="status" aria-atomic="true"></p>
    </article>

          
            <div class="control-group">
                <button id="btn-subtrair" class="btn btn-damage" aria-label="Diminuir XP">-1 XP</button>
                <button id="btn-adicionar" class="btn btn-action" aria-label="Aumentar XP">+1 XP</button>
            </div>

            <footer class="game-footer">
                <button id="btn-reset" class="btn-reset" aria-label="Zerar o jogo">[ recomeçar do zero ]</button>
            </footer>
</section>
    </main>
    <script src="script.js"></script>
</body>
</html>
